<script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnText = document.getElementById('loginBtnText');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        errorMsg.classList.add('hidden');
        errorMsg.innerText = '';

        loginBtn.disabled = true;
        loginBtnText.innerText = 'Signing in...';

        try {
            const res = await fetch('http://localhost:5000/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username,
                    password
                })
            });

            const data = await res.json();

            if (data.success) {

                localStorage.setItem(
                    'user',
                    JSON.stringify(data.user)
                );

                /*
                 * IMPORTANT:
                 * These files must exist inside the same frontend folder
                 * as this index.html file.
                 */

                switch (data.user.role) {

                    case 'STUDENT':
                        window.location.href = 'student-dash.html';
                        break;

                    case 'LECTURER':
                        window.location.href = 'lecturer-dash.html';
                        break;

                    case 'ACADEMIC':
                        window.location.href = 'academic-dash.html';
                        break;

                    case 'REGISTRAR':
                        window.location.href = 'registrar-dash.html';
                        break;

                    default:
                        showError('Your account role is not configured.');
                }

            } else {
                showError(data.message || 'Invalid username or password.');
            }

        } catch (error) {

            console.error(error);

            showError(
                'Unable to connect to the server. Please make sure the backend is running.'
            );

        } finally {
            loginBtn.disabled = false;
            loginBtnText.innerText = 'Sign In';
        }
    });


    function showError(message) {
        errorMsg.innerText = message;
        errorMsg.classList.remove('hidden');
    }
</script>

</body>
